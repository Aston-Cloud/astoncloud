version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aston_postgres
    environment:
      POSTGRES_USER: ${PG_USER:-aston_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aston_secret_pass}
      POSTGRES_DB: ${PG_DATABASE:-aston_cloud_dev}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-aston_admin} -d ${PG_DATABASE:-aston_cloud_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aston_network

  redis:
    image: redis:7-alpine
    container_name: aston_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aston_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aston_network:
    driver: bridge
